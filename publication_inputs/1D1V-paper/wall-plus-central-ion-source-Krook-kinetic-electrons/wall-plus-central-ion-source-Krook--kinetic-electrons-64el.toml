[evolve_moments]
density = true
parallel_flow = true
pressure = true

[krook_collisions]
use_krook = true

[composition]
T_e = 1.0
n_ion_species = 1
n_neutral_species = 0
electron_physics = "kinetic_electrons"

[ion_source_1]
active = true
z_profile = "gaussian"
z_width = 0.1
source_strength = 10.0
source_T = 3.0

[ion_source_2]
active = true
z_profile = "wall_exp_decay"
z_width = 0.05
source_strength = 20.0
source_T = 0.03

[reference_params]
Bref = 1.0
Lref = 20.0
Nref = 1.0e19
Tref = 100.0

[z]
ngrid = 6
discretization = "chebyshev_pseudospectral"
nelement = 63
#nelement_local = 2
L = 1.0
element_spacing_option = "sqrt"
bc = "wall"

[vpa]
ngrid = 5
discretization = "chebyshev_pseudospectral"
nelement = 128
L = 70.0
element_spacing_option = "coarse_tails8"
bc = "zero"

[ion_species_1]
initial_temperature = 0.33333333333333333333333
initial_density = 1.0

[z_IC_ion_species_1]
initialization_option = "gaussian"
density_amplitude = 0.0
temperature_amplitude = 0.0
density_phase = 0.0
upar_amplitude = 1.0
temperature_phase = 0.0
upar_phase = 0.0

[timestepping]
type = "KennedyCarpenterARK324"
kinetic_electron_solver = "implicit_time_evolving"
kinetic_ion_solver = "full_explicit_ion_advance"
nstep = 1000000000
dt = 1.0e-6
minimum_dt = 1.0e-6
#maximum_dt = 1.0e-4
max_increase_factor = 1.001
rtol = 1.0e-6
atol = 1.0e-13
step_update_prefactor = 0.1
nwrite = 1000000
nwrite_dfns = 1000000
steady_state_residual = true
converged_residual_value = 1.0e-6

[electron_timestepping]
nstep = 5000000
dt = 1.0e-6
maximum_dt = 1.0e-4
nwrite = 10000
nwrite_dfns = 100000
rtol = 0.001
atol = 1.0e-14
minimum_dt = 1.0e-9
decrease_dt_iteration_threshold = 50
increase_dt_iteration_threshold = 20
cap_factor_ion_dt = 10.0
initialization_residual_value = 2.5
converged_residual_value = 1.0e-2
include_wall_bc_in_preconditioner = true

[nonlinear_solver]
nonlinear_max_iterations = 100
rtol = 1.0e-6
atol = 1.0e-14
linear_restart = 5
preconditioner_update_interval = 25
total_its_soft_limit = 30

[ion_numerical_dissipation]
force_minimum_pdf_value = 0.0
